<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
    <style>
      table,
      tr,
      td,
      th {
        border: 1px solid;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <h1>Best CLubs in the world</h1>

    <table>
      <thead>
        <tr>
          <th>Club name</th>
          <th>Worth</th>
          <th>No of players</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Chelsea</td>
          <td>20 billion</td>
          <td>2000</td>
        </tr>
        <tr>
          <td>Real Madrid</td>
          <td>10 billion</td>
          <td>20</td>
        </tr>
      </tbody>
    </table>

    <table>
      <caption>
        Name of players
      </caption>
      <thead>
        <tr>
          <th colspan="2">Name</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>John</td>
          <td>Doe</td>
          <td>29</td>
        </tr>
        <tr>
          <td>Jane</td>
          <td>Doe</td>
          <td>39</td>
        </tr>

        <tr>
          <td>John</td>
          <td>Legend</td>
          <td rowspan="2">28</td>
        </tr>

        <tr>
          <td>John</td>
          <td>Legend</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
