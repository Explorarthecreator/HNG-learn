<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h1>Contact Fom</h1>

    <form action="">
      <fieldset>
        <legend>Personal Details</legend>
        <label for="name">First Name</label>
        <input type="text" placeholder="Enter your name" id="name" required />
        <br />
        <label>Password</label>
        <input type="password" placeholder="Enter your password" /><br />
        <input type="number" placeholder="Enter your number" /><br />
        <input type="tel" placeholder="Enter phone number" /><br />
        <input type="date" placeholder="Select date of birth" /><br />
        <input type="file" accept="image/*" name="" id="" />
        <input type="radio" name="" id="" />
        <input type="checkbox" name="" id="" />
        <input type="email" name="" id="" autocomplete="email" />

        <p>Select your gender</p>
        <label for="gender">Male</label>
        <input type="radio" name="gender" id="male" value="male" />
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female" /><br />
      </fieldset>

      <label for="level">Choose your level</label>

      <select name="level" id="level">
        <option value="">Choose your html level</option>
        <option value="basic">Basic</option>
        <option value="advanced">Advanced</option>
        <option value="mid">Mid</option>
        <option value="intermediate">Intermediate</option>
      </select>
      <br />

      <input type="button" value="Click me" />
      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />

      <button type="reset">Reset</button>
    </form>
  </body>
</html>
